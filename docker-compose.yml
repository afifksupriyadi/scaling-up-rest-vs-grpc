services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  seeder:
    build:
      context: .
      dockerfile: docker/seeder.Dockerfile
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  rest-server:
    build:
      context: .
      dockerfile: docker/rest-server.Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8081:8081"
      - "6061:6061"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully

  grpc-server:
      build:
        context: .
        dockerfile: docker/grpc-server.Dockerfile
      env_file:
        - .env
      ports:
        - "50051:50051"
        - "6060:6060"
      volumes:
        - ./certs:/certs:ro
      depends_on:
        redis:
          condition: service_healthy
        seeder:
          condition: service_completed_successfully