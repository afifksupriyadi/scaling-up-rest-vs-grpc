syntax = "proto3";

package student;

option go_package = "scaling-up-rest-vs-grpc/internal/data/model";

// Empty is used for RPCs that take no parameters.
message Empty {}

// Course represents a single course entry within a semester.
message Course {
  string code = 1;
  string name = 2;
  int32 credits = 3;
  float score = 4;
}

// SemesterRecord represents one semester's academic record.
message SemesterRecord {
  int32 semester = 1;
  float semester_gpa = 2;
  repeated Course courses = 3;
}

// AcademicData represents a student's academic program information.
message AcademicData {
  string faculty = 1;
  string study_program = 2;
  int32 current_semester = 3;
}

// Student represents a single student record.
message Student {
  string student_id = 1;
  string name = 2;
  string gender = 3;
  AcademicData academic_data = 4;
  repeated SemesterRecord academic_history = 5;
  float cumulative_gpa = 6;
}

// StudentResponse always wraps student records in a list.
// - Applies uniformly to all three read sizes (small=1, medium=100, large=1000).
// - Keeps the response shape identical across sizes, so only entry count varies.
message StudentResponse {
  repeated Student data = 1;
}

// CreateStudentResponse acknowledges a successful write.
// - Deliberately minimal, POST measures deserialization cost of the request, not the size of the response.
message CreateStudentResponse {
  bool success = 1;
}

// StudentService exposes the read and write paths used to benchmark
// REST versus gRPC.
// - GetStudentsSmall/Medium/Large: read path, one RPC per data size.
// - CreateStudent: write path, mirrors the read RPCs in reverse, evaluates server-side deserialization cost instead of serialization.
service StudentService {
  rpc GetStudentsSmall(Empty) returns (StudentResponse);
  rpc GetStudentsMedium(Empty) returns (StudentResponse);
  rpc GetStudentsLarge(Empty) returns (StudentResponse);
  rpc CreateStudent(Student) returns (CreateStudentResponse);
}